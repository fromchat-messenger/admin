<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FromChat Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* FromChat M3 (seed #4F5B93) — matches admin ThemeProvider / Android tonal palette */
      :root {
        --fc-surface: #fef7ff;
        --fc-on-surface: #1d1b20;
        --fc-primary: #4f5b93;
        --fc-primary-track: rgba(79, 91, 147, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fc-surface: #141218;
          --fc-on-surface: #e6e1e5;
          --fc-primary: #b8c1ff;
          --fc-primary-track: rgba(184, 193, 255, 0.2);
        }
      }

      html,
      body {
        margin: 0;
        background: var(--fc-surface);
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--fc-surface);
        opacity: 1;
        transition: opacity 0.45s cubic-bezier(0.2, 0, 0, 1);
      }

      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }

      .material-loader {
        display: block;
        width: 6rem;
        height: 6rem;
        animation: material-loader-spin 1.2s linear infinite;
      }

      .material-loader__track {
        stroke: var(--fc-primary-track);
      }

      .material-loader__arc {
        stroke: var(--fc-primary);
        stroke-dasharray: 80 160;
        stroke-dashoffset: 0;
        transform-origin: center;
        animation: material-loader-dash 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* MD3 indeterminate circular: sweep + rotate */
      @keyframes material-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes material-loader-dash {
        0% {
          stroke-dasharray: 1 160;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 100 160;
          stroke-dashoffset: -20;
        }
        100% {
          stroke-dasharray: 1 160;
          stroke-dashoffset: -125;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      id="boot-splash"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="Loading FromChat Admin"
    >
      <svg class="material-loader" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="material-loader__track" cx="24" cy="24" r="20" fill="none" stroke-width="4" />
        <circle
          class="material-loader__arc"
          cx="24"
          cy="24"
          r="20"
          fill="none"
          stroke-width="4"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
